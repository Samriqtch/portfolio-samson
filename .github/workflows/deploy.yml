# Construit le site et l'envoie sur le VPS Hostinger.
# Lancement manuel : onglet Actions → Déploiement → Run workflow.
# Les secrets à créer sont expliqués dans le README (section 4).
name: Déploiement

on:
  workflow_dispatch:
  # Pour déployer automatiquement à chaque push sur main, décommente les 3 lignes suivantes :
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Envoyer sur le VPS
        run: rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}"
